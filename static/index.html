<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inscription</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="card">
    <h1>Créer un compte</h1>
    <form id="form">
      <label>Nom</label>
      <input id="nom" required>
      <label>Prénom</label>
      <input id="prenom" required>
      <label>Email</label>
      <input id="email" type="email" required>
      <label>Mot de passe</label>
      <input id="password" type="password" minlength="6" required>
      <button type="submit">Confirmer</button>
      <div id="msg" class="msg"></div>
    </form>
    <p class="sep">Déjà inscrit ?</p>
    <button class="secondary" onclick="location.href='/accueil'">Sign in</button>
  </div>

  <script>
    const msg = document.getElementById("msg");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.className = "msg"; msg.textContent = "";
      const res = await fetch("/api/register", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          nom: nom.value, prenom: prenom.value,
          email: email.value, password: password.value
        })
      });
      const data = await res.json();
      if (res.ok) {
        msg.className = "msg ok";
        msg.textContent = data.message + " Redirection...";
        setTimeout(() => location.href = "/accueil", 1000);
      } else {
        msg.className = "msg err";
        msg.textContent = typeof data.detail === "string" ? data.detail : "Données invalides";
      }
    });
  </script>
</body>
</html>
